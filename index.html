<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Intelligent – pause, check, confirm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f12;
      color: #f4f4f5;
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .tagline { color: #a3e635; text-align: center; font-weight: 600; margin-bottom: 6px; }
    .subtitle { color: #a1a1aa; text-align: center; font-size: 0.9rem; margin-bottom: 28px; }
    textarea, input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: #1a1a21;
      border: 1px solid #333;
      color: #fff;
      font-size: 1rem;
    }
    textarea { height: 150px; resize: vertical; margin-bottom: 12px; }
    button {
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #8b5cf6; color: white; width: 100%; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-lime { background: #a3e635; color: #000; width: 100%; }
    .btn-secondary { background: #27272a; color: white; }
    .btn-small { padding: 8px 12px; font-size: 0.85rem; border-radius: 10px; }
    .claim-card {
      background: #1a1a21;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .claim-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .decision-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    .decision-btn {
      background: #27272a;
      color: white;
      padding: 12px 8px;
      font-size: 0.9rem;
      border-radius: 12px;
    }
    .decision-btn.active { background: #a3e635; color: #000; }
    .links a {
      display: inline-block;
      background: #27272a;
      color: #a1a1aa;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      text-decoration: none;
      margin: 4px 4px 4px 0;
    }
    .hidden { display: none; }
    .report-box {
      background: #1a1a21;
      border: 1px solid #a3e635;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
    }
    .empty-note { color:#a1a1aa; font-size: 0.9rem; margin-bottom:12px; }

    .progress-track {
      height: 6px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: #a3e635;
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .dot-nav { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #333; border: none; cursor: pointer; padding: 0;
      transition: transform 0.15s ease;
    }
    .dot.decided { background: #a3e635; }
    .dot.current { transform: scale(1.5); background: #8b5cf6; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #27272a;
      color: #d4d4d8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .claim-text-large { font-size: 1.05rem; font-weight: 500; margin-bottom: 14px; }
    .claim-text-large mark {
      background: rgba(163, 230, 53, 0.25);
      color: #d9f99d;
      padding: 0 2px;
      border-radius: 4px;
    }
    .check-card {
      background: #1a1a21;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .nav-row { display: flex; gap: 10px; margin-top: 16px; }
    .nav-row button { flex: 1; }
    .query-label { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 6px; }
    .query-label span { font-size: 0.75rem; color: #a1a1aa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .reset-link { background: none; border: none; color: #8b5cf6; font-size: 0.75rem; font-weight: 600; padding: 0; cursor: pointer; }
    .search-btn {
      background: #27272a; color: #d4d4d8; border: 1px solid #333;
      padding: 8px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
      margin: 4px 6px 4px 0; cursor: pointer;
    }
    .search-btn:hover { background: #333; }

    .concept-note {
      background: #241a0f;
      border: 1px solid #7c5a1e;
      color: #f2c879;
      font-size: 0.82rem;
      padding: 10px 12px;
      border-radius: 12px;
      margin: 10px 0 4px;
    }
    .preview-box {
      background: #14141a;
      border: 1px solid #2d2d35;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
    }
    .preview-title { font-weight: 700; color: #a3e635; margin-bottom: 6px; font-size: 0.95rem; }
    .preview-extract { font-size: 0.88rem; color: #d4d4d8; margin-bottom: 8px; }
    .preview-link { font-size: 0.8rem; color: #8b5cf6; text-decoration: none; font-weight: 600; }
    .preview-loading { color: #a1a1aa; font-size: 0.85rem; }
    .source-card {
      border-top: 1px solid #2d2d35;
      padding-top: 12px;
      margin-top: 12px;
    }
    .source-card:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
    .source-label { font-size: 0.72rem; color: #8b5cf6; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 5px; }
    .agree-note {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .agree-yes { background: rgba(163,230,53,0.12); color: #a3e635; }
    .agree-diff { background: rgba(139,92,246,0.12); color: #c4b5fd; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stay Intelligent</h1>
    <div class="tagline">pause, check, confirm</div>
    <div class="subtitle">Check AI answers yourself. No automatic scores.</div>

    <!-- STEP 1 -->
    <div id="step-paste">
      <textarea id="originalText" placeholder="Paste the AI answer here..."></textarea>
      <button class="btn-primary" onclick="suggestClaims()">Suggest claims</button>
    </div>

    <!-- STEP 2 -->
    <div id="step-select" class="hidden">
      <h2 style="font-size: 1.2rem; margin-bottom: 6px;">Review suggested claims</h2>
      <p style="color:#a1a1aa; font-size: 0.9rem; margin-bottom: 14px;">
        Keep only clear factual statements. Delete the rest or add your own.
      </p>
      <button class="btn-secondary btn-small" onclick="addClaim()" style="margin-bottom: 16px;">+ Add your own claim</button>
      <div id="claimsList"></div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-secondary" style="flex:1" onclick="goToPaste()">Back</button>
        <button class="btn-primary" style="flex:1" onclick="startChecking()">Check these claims</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div id="step-check" class="hidden">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="dot-nav" id="dotNav"></div>
      <div id="checkCard"></div>
      <div class="nav-row">
        <button class="btn-secondary" id="prevBtn" onclick="prevClaim()">Back</button>
        <button class="btn-secondary" id="nextBtn" onclick="nextClaim()">Skip</button>
      </div>
      <button class="btn-lime" id="createReportBtn" onclick="createReport()" disabled style="margin-top: 12px;">
        Finish all decisions first
      </button>
    </div>

    <!-- STEP 4 -->
    <div id="step-report" class="hidden">
      <div class="report-box">
        <div style="color:#a3e635; font-weight:700; margin-bottom:4px;">Human-checked report</div>
        <div style="color:#a1a1aa; font-size:0.8rem; margin-bottom:16px;">Stay Intelligent · pause, check, confirm</div>
        <div id="reportContent"></div>
      </div>
      <button class="btn-secondary" style="width:100%; margin-top:16px;" onclick="resetAll()">Check another answer</button>
    </div>
  </div>

  <script>
    let originalText = "";
    let claims = [];

    // ---------- Claim extraction ----------

    const ABBREV_RE = /\b(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|vs|etc|e\.g|i\.e|U\.S|U\.K|St|approx|no|fig|vol|Inc|Ltd|Co|approx)\.$/i;
    const BULLET_RE = /^(?:[-*•‣▪]|\d+[.)])\s+(.*)/;

    function extractSentences(text) {
      const lines = text.replace(/\r\n/g, "\n").split("\n").map(l => l.trim()).filter(Boolean);
      const sentences = [];

      lines.forEach(line => {
        const bulletMatch = line.match(BULLET_RE);
        const content = bulletMatch ? bulletMatch[1] : line;

        // protect decimals (3.5) and common abbreviations so we don't split on them
        const protectedText = content.replace(/(\d)\.(\d)/g, "$1\u2038$2");

        const parts = protectedText.split(/(?<=[.!?])\s+(?=[A-Z0-9"'(])/);

        let buffer = "";
        parts.forEach(part => {
          buffer = buffer ? buffer + " " + part : part;
          if (!ABBREV_RE.test(buffer.trim())) {
            sentences.push(buffer.trim());
            buffer = "";
          }
        });
        if (buffer) sentences.push(buffer.trim());
      });

      return sentences.map(s => s.replace(/\u2038/g, "."));
    }

    function cleanSentence(s) {
      return s.replace(/\s+/g, " ").trim();
    }

    function scoreClaim(s) {
      const lower = s.toLowerCase();
      const words = s.split(/\s+/).filter(Boolean);
      const wordCount = words.length;

      if (wordCount < 6) return -10;

      let score = 0;
      if (wordCount >= 8 && wordCount <= 35) score += 2;
      if (s.length >= 40 && s.length <= 260) score += 1;

      if (/\d/.test(s)) score += 3;
      if (/(19|20)\d{2}/.test(s)) score += 2;
      if (/\$|£|€|%|percent|km|kg|million|billion|thousand/.test(lower)) score += 2;
      if (/\b[A-Z][a-z]+(?:\s[A-Z][a-z]+)+\b/.test(s)) score += 1; // proper-noun-like phrase

      if (/\b(is|was|are|were|has|have|had|provides|includes|requires|costs|launched|founded|signed|introduced|announced|reported|found|shows|states|according to)\b/i.test(s)) score += 1;

      if (/^(for example|such as|in summary|in conclusion|overall|additionally|furthermore|moreover|also|note that|it's worth noting|remember|generally speaking|in general)\b/i.test(s)) score -= 3;
      if (/\?$/.test(s)) score -= 5;
      if (/^(please|you should|you can|let's|try|consider|i recommend|i suggest)\b/i.test(s)) score -= 3;
      if (s.endsWith(":")) score -= 4;

      return score;
    }

    function dedupeClaims(items) {
      const seenSets = [];
      const result = [];
      items.forEach(item => {
        const wordSet = new Set(item.text.toLowerCase().split(/\W+/).filter(w => w.length > 3));
        const isDup = seenSets.some(prev => {
          const overlap = [...wordSet].filter(w => prev.has(w)).length;
          const smaller = Math.min(wordSet.size, prev.size) || 1;
          return overlap / smaller > 0.7;
        });
        if (!isDup) {
          seenSets.push(wordSet);
          result.push(item);
        }
      });
      return result;
    }

    function suggestClaims() {
      originalText = document.getElementById("originalText").value.trim();
      if (!originalText) {
        alert("Please paste some text first");
        return;
      }

      const sentences = extractSentences(originalText).map(cleanSentence).filter(Boolean);

      const candidates = sentences.map((text, index) => ({
        text,
        index,
        score: scoreClaim(text)
      })).filter(c => c.score >= 2);

      const deduped = dedupeClaims(candidates);

      // pick the strongest 8, then restore original reading order
      const top = deduped
        .sort((a, b) => b.score - a.score)
        .slice(0, 8)
        .sort((a, b) => a.index - b.index);

      claims = top.map((item, i) => ({
        id: Date.now() + i,
        text: item.text,
        queries: buildQueries(item.text),
        decision: "",
        note: ""
      }));

      showStep("select");
      renderSelect();
    }

    // ---------- Checkability helpers ----------

    function classifyClaim(text) {
      if (/\b(19|20)\d{2}\b/.test(text)) return { type: "date", label: "Date", icon: "📅" };
      if (/[$£€]|%|\d/.test(text)) return { type: "numeric", label: "Number", icon: "🔢" };
      if (/\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3}\b/.test(text)) return { type: "entity", label: "Named", icon: "🏷️" };
      return { type: "general", label: "General", icon: "💬" };
    }

    function highlightClaim(text) {
      const marks = [];
      let working = text;
      const patterns = [
        /\b(?:19|20)\d{2}\b/g,
        /[$£€]\s?\d[\d,.]*\s?(?:million|billion|thousand)?/gi,
        /\b\d[\d,.]*\s?%/g,
        /\b\d[\d,.]*\b/g,
        /\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3}\b/g
      ];
      patterns.forEach(re => {
        working = working.replace(re, m => {
          const token = `\u0001${marks.length}\u0002`;
          marks.push(m);
          return token;
        });
      });
      let escaped = escapeHtml(working);
      marks.forEach((m, i) => {
        escaped = escaped.split(`\u0001${i}\u0002`).join(`<mark>${escapeHtml(m)}</mark>`);
      });
      return escaped;
    }

    const STOPWORDS = new Set(["a","an","the","is","was","were","are","be","been","being","this","that","these","those","it","its","as","of","to","in","on","for","and","or","but","so","then","because","with","from","by","at","than","which","who","whom","whose","what","when","where","why","how","there","here","not","no","if","while","during","between","into","through","about","above","below","up","down","out","off","over","under","again","once","also","just","only","very","can","will","would","should","could","may","might","must","shall","do","does","did","doing","have","has","had","having","i","you","he","she","we","they","them","his","her","their","our","your","my","me","him","us","probably","actually","really","basically"]);

    function stripFormatting(text) {
      return text
        .replace(/\$\$?/g, " ")
        .replace(/\\\(|\\\)|\\\[|\\\]/g, " ")
        .replace(/\\[a-zA-Z]+/g, " ")   // \frac, \times, etc.
        .replace(/[{}]/g, " ")
        .replace(/[_^]/g, " ")
        .replace(/[()]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Pull out the words worth searching on: numbers/dates and proper-noun-like
    // words are always kept; everything else is filtered through a stopword list.
    function extractKeywords(text, maxWords) {
      const cleaned = stripFormatting(text);
      const words = cleaned.split(/\s+/).filter(Boolean);
      const kept = [];
      words.forEach(w => {
        const bare = w.replace(/[^\w%$£€.]/g, "");
        if (!bare) return;
        const lower = bare.toLowerCase();
        const isSignal = /^\d/.test(bare) || /^[A-Z]/.test(bare);
        if (isSignal || (!STOPWORDS.has(lower) && bare.length > 2)) {
          kept.push(bare);
        }
      });
      return kept.slice(0, maxWords).join(" ");
    }

    function findProperNounPhrase(text) {
      const match = stripFormatting(text).match(/\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3}\b/);
      return match ? match[0] : "";
    }

    // Builds a tailored query per search engine — Google gets natural phrasing,
    // Scholar/compare-sources get dense keyword or topic-style phrasing.
    function buildQueries(text) {
      const google = (() => {
        const c = stripFormatting(text);
        const words = c.split(" ");
        return words.length > 16 ? words.slice(0, 16).join(" ") : c;
      })();
      const dense = extractKeywords(text, 8) || google;
      const topic = findProperNounPhrase(text) || extractKeywords(text, 5) || google;
      return {
        google,
        scholar: dense,
        compare: topic,
        factcheck: google
      };
    }

    function sourceUrl(source, query) {
      const q = encodeURIComponent(query);
      switch (source) {
        case "google": return `https://www.google.com/search?q=${q}`;
        case "factcheck": return `https://www.google.com/search?q=${q}+site:snopes.com+OR+site:apnews.com/hub/ap-fact-check+OR+site:factcheck.org`;
        case "scholar": return `https://scholar.google.com/scholar?q=${q}`;
      }
    }

    function getSourceButtons() {
      return [
        { source: "compare", label: "Compare sources" },
        { source: "google", label: "Google" },
        { source: "factcheck", label: "Fact-check" },
        { source: "scholar", label: "Scholar" }
      ];
    }

    // Claims with no hard numbers/dates/names are relational or conceptual —
    // no single page will state them verbatim, so flag that up front.
    function isConceptual(meta) {
      return meta.type === "general";
    }

    async function fetchWikiExtract(lang, query) {
      if (!query || !query.trim()) return { ok: false, reason: "empty query" };
      try {
        const apiUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=3&format=json&origin=*`;
        const res = await fetch(apiUrl);
        if (!res.ok) return { ok: false, reason: `HTTP ${res.status}` };
        const data = await res.json();
        if (data.error) return { ok: false, reason: data.error.info || "API error" };
        const pages = data.query && data.query.pages;
        const page = pages && Object.values(pages)[0];
        if (!page || !page.extract) return { ok: false, reason: "no matching article" };
        return {
          ok: true,
          source: lang === "en" ? "Wikipedia" : "Simple Wikipedia",
          title: page.title,
          extract: page.extract,
          url: `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title.replace(/ /g, "_"))}`
        };
      } catch (e) { return { ok: false, reason: e.message || "network/fetch blocked" }; }
    }

    async function fetchYearFact(year) {
      try {
        const res = await fetch(`https://numbersapi.com/${year}/year?json`);
        if (!res.ok) return { ok: false, reason: `HTTP ${res.status}` };
        const data = await res.json();
        if (!data.found) return { ok: false, reason: "no year trivia found" };
        return {
          ok: true,
          source: "Year facts",
          title: String(year),
          extract: data.text,
          url: `https://numbersapi.com/${year}/year`
        };
      } catch (e) { return { ok: false, reason: e.message || "network/fetch blocked" }; }
    }

    // Crude but honest signal: how much substantive vocabulary two extracts share.
    function wordOverlapRatio(a, b) {
      const setA = new Set(a.toLowerCase().split(/\W+/).filter(w => w.length > 4));
      const setB = new Set(b.toLowerCase().split(/\W+/).filter(w => w.length > 4));
      if (setA.size === 0 || setB.size === 0) return 0;
      let overlap = 0;
      setA.forEach(w => { if (setB.has(w)) overlap++; });
      return overlap / Math.min(setA.size, setB.size);
    }

    async function showSourceComparison() {
      const c = claims[currentIndex];
      const query = (c.queries && c.queries.compare) || buildQueries(c.text).compare;
      const box = document.getElementById("previewBox");
      box.classList.remove("hidden");
      box.innerHTML = `<div class="preview-loading">Gathering independent sources for "${escapeHtml(query || c.text)}"…</div>`;

      const yearMatch = c.text.match(/\b(19|20)\d{2}\b/);
      const tasks = [fetchWikiExtract("en", query), fetchWikiExtract("simple", query)];
      if (yearMatch) tasks.push(fetchYearFact(yearMatch[0]));

      const outcomes = await Promise.all(tasks);
      console.log("Compare sources outcomes:", outcomes);

      const results = outcomes.filter(r => r.ok);
      const failures = outcomes.filter(r => !r.ok);

      if (results.length === 0) {
        const reasonList = failures.map(f => `<li>${escapeHtml(f.reason)}</li>`).join("");
        box.innerHTML = `
          <div class="preview-loading">
            No independent sources came back for this claim.
            <ul style="margin:8px 0 0 18px; opacity:0.8;">${reasonList}</ul>
            Try Google or Scholar instead, or verify from domain knowledge.
          </div>`;
        return;
      }

      let agreementNote = "";
      const wikiResults = results.filter(r => r.source === "Wikipedia" || r.source === "Simple Wikipedia");
      if (wikiResults.length === 2) {
        const overlap = wordOverlapRatio(wikiResults[0].extract, wikiResults[1].extract);
        agreementNote = overlap > 0.25
          ? `<div class="agree-note agree-yes">✓ Wikipedia and Simple Wikipedia broadly align</div>`
          : `<div class="agree-note agree-diff">These two emphasize different things — worth reading both before deciding</div>`;
      }

      box.innerHTML = agreementNote + results.map(r => `
        <div class="source-card">
          <div class="source-label">${escapeHtml(r.source)} · ${escapeHtml(r.title)}</div>
          <div class="preview-extract">${escapeHtml(r.extract)}</div>
          <a class="preview-link" href="${r.url}" target="_blank" rel="noopener">Read more →</a>
        </div>
      `).join("");
    }

    function openSearch(source) {
      const c = claims[currentIndex];
      if (source === "compare") { showSourceComparison(); return; }
      const query = (c.queries && c.queries[source]) || buildQueries(c.text)[source];
      window.open(sourceUrl(source, query), "_blank", "noopener");
    }

    function toggleEdit() {
      const box = document.getElementById("editBox");
      box.classList.toggle("hidden");
    }

    function setEngineQuery(source, value) {
      claims[currentIndex].queries[source] = value;
    }

    function resetQueries() {
      claims[currentIndex].queries = buildQueries(claims[currentIndex].text);
      renderCurrentCheck();
    }

    // ---------- UI rendering ----------

    function renderSelect() {
      const list = document.getElementById("claimsList");
      if (claims.length === 0) {
        list.innerHTML = '<p class="empty-note">No strong claims found. Please add your own.</p>';
        return;
      }
      list.innerHTML = claims.map(c => `
        <div class="claim-card">
          <div>${escapeHtml(c.text)}</div>
          <div class="claim-actions">
            <button class="btn-small btn-secondary" onclick="editClaim(${c.id})">Edit</button>
            <button class="btn-small btn-secondary" onclick="deleteClaim(${c.id})">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function editClaim(id) {
      const claim = claims.find(c => c.id === id);
      const newText = prompt("Edit claim:", claim.text);
      if (newText && newText.trim()) {
        claim.text = newText.trim();
        renderSelect();
      }
    }

    function deleteClaim(id) {
      claims = claims.filter(c => c.id !== id);
      renderSelect();
    }

    function addClaim() {
      const text = prompt("Type or paste a clear factual claim:");
      if (text && text.trim()) {
        claims.push({
          id: Date.now(),
          text: text.trim(),
          queries: buildQueries(text.trim()),
          decision: "",
          note: ""
        });
        renderSelect();
      }
    }

    let currentIndex = 0;

    function startChecking() {
      if (claims.length === 0) {
        alert("Add at least one claim first");
        return;
      }
      currentIndex = claims.findIndex(c => !c.decision);
      if (currentIndex === -1) currentIndex = 0;
      showStep("check");
      renderCurrentCheck();
    }

    function renderDotNav() {
      const dotNav = document.getElementById("dotNav");
      dotNav.innerHTML = claims.map((c, i) => `
        <button class="dot ${c.decision ? "decided" : ""} ${i === currentIndex ? "current" : ""}"
          onclick="goToClaim(${i})" aria-label="Claim ${i+1}"></button>
      `).join("");
    }

    function renderCurrentCheck() {
      const c = claims[currentIndex];
      const meta = classifyClaim(c.text);
      if (!c.queries) c.queries = buildQueries(c.text);
      const buttons = getSourceButtons();

      const decidedCount = claims.filter(cl => cl.decision).length;
      document.getElementById("progressFill").style.width = `${(decidedCount / claims.length) * 100}%`;
      renderDotNav();

      document.getElementById("checkCard").innerHTML = `
        <div class="check-card">
          <div class="badge">${meta.icon} ${meta.label} claim · ${currentIndex+1} of ${claims.length}</div>
          <div class="claim-text-large">${highlightClaim(c.text)}</div>

          ${isConceptual(meta) ? `<div class="concept-note">This is a conceptual claim — no single search result will state it word-for-word. Use the links to read the underlying principle and judge for yourself, rather than looking for an exact match.</div>` : ""}

          <div class="links" style="margin-top:8px;">
            ${buttons.map(b => `<button class="search-btn" onclick="openSearch('${b.source}')">${escapeHtml(b.label)}</button>`).join("")}
          </div>
          <div id="previewBox" class="preview-box hidden"></div>
          <button class="reset-link" style="margin-top:8px;" onclick="toggleEdit()">Edit search terms</button>

          <div id="editBox" class="hidden" style="margin-top:10px;">
            ${buttons.map(b => `
              <div class="query-label"><span>${escapeHtml(b.label)}</span></div>
              <input type="text" value="${escapeHtml(c.queries[b.source] || "")}" oninput="setEngineQuery('${b.source}', this.value)">
            `).join("")}
            <button class="reset-link" style="margin-top:8px;" onclick="resetQueries()">Reset to auto-generated</button>
          </div>

          <div class="decision-grid" style="margin-top:16px;">
            <button class="decision-btn ${c.decision==='Yes, this matches'?'active':''}" onclick="setDecision('Yes, this matches')">Yes, this matches</button>
            <button class="decision-btn ${c.decision==='Partly correct'?'active':''}" onclick="setDecision('Partly correct')">Partly correct</button>
            <button class="decision-btn ${c.decision==='No, this is wrong'?'active':''}" onclick="setDecision('No, this is wrong')">No, this is wrong</button>
            <button class="decision-btn ${c.decision==='I can’t tell'?'active':''}" onclick="setDecision('I can’t tell')">I can’t tell</button>
          </div>
          <input type="text" placeholder="Short note — e.g. where you confirmed it (optional)" value="${escapeHtml(c.note)}" oninput="setNote(this.value)">
        </div>
      `;

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("prevBtn").style.opacity = currentIndex === 0 ? "0.4" : "1";
      document.getElementById("nextBtn").textContent = currentIndex === claims.length - 1 ? "Stay here" : "Skip";
      document.getElementById("nextBtn").disabled = currentIndex === claims.length - 1;

      updateReportButton();
    }

    function goToClaim(index) {
      currentIndex = index;
      renderCurrentCheck();
    }

    function prevClaim() {
      if (currentIndex > 0) { currentIndex--; renderCurrentCheck(); }
    }

    function nextClaim() {
      if (currentIndex < claims.length - 1) { currentIndex++; renderCurrentCheck(); }
    }

    function setDecision(decision) {
      claims[currentIndex].decision = decision;
      // auto-advance to the next undecided claim after a short beat
      const nextUndecided = claims.findIndex((c, i) => i > currentIndex && !c.decision);
      setTimeout(() => {
        if (nextUndecided !== -1) {
          currentIndex = nextUndecided;
        } else if (currentIndex < claims.length - 1) {
          currentIndex++;
        }
        renderCurrentCheck();
      }, 280);
      renderCurrentCheck(); // instant feedback on the active button before advancing
    }

    function setNote(note) {
      claims[currentIndex].note = note;
    }

    function updateReportButton() {
      const allDone = claims.every(c => c.decision);
      const btn = document.getElementById("createReportBtn");
      btn.disabled = !allDone;
      btn.textContent = allDone ? "Create report" : "Finish all decisions first";
    }

    function createReport() {
      let html = `<div style="margin-bottom:16px; white-space:pre-wrap; opacity:0.85;">${escapeHtml(originalText)}</div>`;
      claims.forEach((c, i) => {
        html += `
          <div style="border-top:1px solid #333; padding-top:12px; margin-top:12px;">
            <div style="font-weight:500;">${i+1}. ${escapeHtml(c.text)}</div>
            <div style="color:#a3e635; margin:4px 0;">${escapeHtml(c.decision)}</div>
            ${c.note ? `<div style="color:#a1a1aa; font-size:0.9rem;">${escapeHtml(c.note)}</div>` : ""}
          </div>
        `;
      });
      document.getElementById("reportContent").innerHTML = html;
      showStep("report");
    }

    function showStep(step) {
      ["paste","select","check","report"].forEach(s => {
        document.getElementById("step-" + s).classList.add("hidden");
      });
      document.getElementById("step-" + step).classList.remove("hidden");
    }

    function goToPaste() { showStep("paste"); }

    function resetAll() {
      document.getElementById("originalText").value = "";
      claims = [];
      showStep("paste");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
